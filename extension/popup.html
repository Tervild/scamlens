<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<style>
		body {
			width: 320px;
			margin: 0;
			padding: 16px;
			font-family: Inter, Arial, sans-serif;
			background: #0f172a;
			color: white;
		}

		h3 {
			margin: 0 0 6px;
			font-size: 20px;
		}

		.subtitle {
			margin: 0 0 14px;
			font-size: 13px;
			color: #94a3b8;
		}

		.input-row {
			display: flex;
			gap: 8px;
		}

		input {
			flex: 1;
			padding: 10px;
			border-radius: 12px;
			border: 1px solid #334155;
			background: #020617;
			color: white;
			outline: none;
		}

		input:focus {
			border-color: #38bdf8;
		}

		button {
			padding: 10px 12px;
			border: none;
			border-radius: 12px;
			background: #2563eb;
			color: white;
			cursor: pointer;
			font-weight: 600;
		}

		button:hover {
			background: #1d4ed8;
		}

		.error {
			margin-top: 8px;
			font-size: 12px;
			color: #f87171;
			min-height: 16px;
		}

		ul {
			list-style: none;
			padding: 0;
			margin: 14px 0 0;
		}

		li {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 9px 10px;
			margin-bottom: 8px;
			border-radius: 12px;
			background: #1e293b;
			font-size: 13px;
		}

		.remove {
			color: #f87171;
			cursor: pointer;
			font-weight: bold;
		}

		.empty {
			margin-top: 14px;
			color: #64748b;
			font-size: 13px;
		}
	</style>
</head>
<body>
    <button id="scanQr">Scan QR codes</button>
	<h3>Ignored websites</h3>
	<p class="subtitle">Sites ScamLens will not check.</p>

	<div class="input-row">
		<input id="siteInput" placeholder="example.com" />
		<button id="addSite">Add</button>
	</div>

	<div id="error" class="error"></div>

	<ul id="siteList"></ul>

	<script src="popup.js"></script>
</body>
</html>
